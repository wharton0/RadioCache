Name: RadioCache
Summary: Download radio audio on Wi-Fi and listen offline

Description: |
  RadioCache fetches audio while you are on Wi-Fi so it is ready when you are
  not — then plays it back offline with full transport controls and
  resume-from-position.

  Features:
  • Scheduled catch-up syncs (an interval, or a fixed daily time)
  • Wi-Fi-only transfers, with resumable downloads via HTTP Range
  • Background playback with notification and lock-screen controls
  • Retention rules that clean up old audio automatically
  • Imports your own audio files

  Content and licensing

  This app ships public-domain sources only and refuses to download anything
  else. Two sources are bundled:

  • Wikimedia Commons — per-file licence metadata there is mandatory, so the
    app can verify each recording is redistributable before fetching it.
  • LibriVox — volunteer-read recordings of public-domain books.

  No commercial broadcaster content is bundled, fetched, or redistributed.
  The licence gate rejects NonCommercial and NoDerivatives material, and
  treats an unstated licence as "do not download" rather than "probably
  fine". Only public, documented HTTP interfaces are used; no access
  control, DRM, or geo-restriction is circumvented.

